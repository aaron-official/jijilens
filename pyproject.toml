[project]
name = "jijilens"
version = "0.1.0"
description = "Multi-object visual marketplace search for Jiji Uganda. Milestone 0: collecting a non-personal listing catalog."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
    "pillow>=10.4",
    "imagehash>=4.3",
]

[project.scripts]
jijilens = "jijilens.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jijilens"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
