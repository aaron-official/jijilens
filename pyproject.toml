[project]
name = "jijilens"
version = "0.1.0"
description = "Multi-object visual marketplace search for Jiji Uganda."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
    "pillow>=10.4",
    "imagehash>=4.3",
    "torch>=2.14.1",
    "torchvision>=0.29.1",
    "open-clip-torch>=3.3.0",
    "numpy>=2.4.6",
    "pgvector>=0.5.1",
    "transformers>=5.20.2",
    "fastapi>=0.161.1",
    "uvicorn[standard]>=0.54.0",
    "python-multipart>=0.0.32",
    "psycopg-pool>=3.3.3",
]

[project.scripts]
jijilens = "jijilens.cli:main"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jijilens"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

# CPU-only PyTorch: this machine has no GPU, and the CUDA wheels are ~3 GB.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
torchvision = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
